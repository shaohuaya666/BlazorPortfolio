name: Deploy to Aliyun Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Publish
      run: dotnet publish --configuration Release --no-build --output ./publish

    - name: Create deployment package
      run: |
        cd publish
        tar -czf ../deploy.tar.gz *
        cd ..

    - name: Deploy to Aliyun Server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.ALIYUN_HOST }}
        username: ${{ secrets.ALIYUN_USERNAME }}
        key: ${{ secrets.ALIYUN_SSH_KEY }}
        port: ${{ secrets.ALIYUN_PORT }}
        source: "deploy.tar.gz"
        target: "/tmp"

    - name: Execute deployment script
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.ALIYUN_HOST }}
        username: ${{ secrets.ALIYUN_USERNAME }}
        key: ${{ secrets.ALIYUN_SSH_KEY }}
        port: ${{ secrets.ALIYUN_PORT }}
        script: |
          # 设置变量
          APP_NAME="blazor"
          DEPLOY_PATH="/var/www/$APP_NAME"
          BACKUP_PATH="/var/backups/$APP_NAME"

          echo "=== Step 1: Creating backup ==="
          if [ -d "$DEPLOY_PATH" ]; then
            echo "Creating backup..."
            mkdir -p $BACKUP_PATH
            tar -czf $BACKUP_PATH/backup_$(date +%Y%m%d_%H%M%S).tar.gz -C $DEPLOY_PATH . 2>/dev/null || echo "Backup failed but continuing..."

            # 只保留最近5个备份
            cd $BACKUP_PATH
            ls -t 2>/dev/null | tail -n +6 | xargs -r rm 2>/dev/null || true
            echo "Backup completed"
          else
            echo "No existing deployment found, skipping backup"
          fi

          echo "=== Step 2: Stopping application ==="
          # 停止 systemd 服务
          if systemctl is-active --quiet blazor.service; then
            echo "Stopping blazor.service..."
            systemctl stop blazor.service
            echo "Service stopped"
          else
            echo "Service is not running"
          fi
          sleep 2

          echo "=== Step 3: Deploying new version ==="
          mkdir -p $DEPLOY_PATH
          echo "Extracting files to $DEPLOY_PATH..."
          tar -xzf /tmp/deploy.tar.gz -C $DEPLOY_PATH
          echo "Files extracted successfully"
          rm /tmp/deploy.tar.gz
          echo "Cleanup completed"

          echo "=== Step 4: Setting permissions ==="
          chmod +x $DEPLOY_PATH/BlazorPortfolio || true
          ls -lh $DEPLOY_PATH/BlazorPortfolio
          echo "Permissions set"

          echo "=== Step 5: Starting application ==="
          echo "Starting blazor.service..."
          systemctl start blazor.service
          sleep 3

          echo "=== Step 6: Verifying startup ==="
          if systemctl is-active --quiet blazor.service; then
            echo "✅ Application started successfully!"
            systemctl status blazor.service --no-pager
            echo ""
            echo "Listening on port 5000"
          else
            echo "❌ Failed to start application"
            echo "Service status:"
            systemctl status blazor.service --no-pager
            echo ""
            echo "Last 30 lines of journal:"
            journalctl -u blazor.service -n 30 --no-pager
            exit 1
          fi

          echo "=== Deployment completed successfully! ==="
